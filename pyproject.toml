[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-ci-witness"
version = "0.1.0"
description = "CI runs as hash-chained witness receipts - regressions and fixes detected from the chain, not dashboards"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-ci-witness"
Source = "https://github.com/szl-holdings/szl-ci-witness"
Issues = "https://github.com/szl-holdings/szl-ci-witness/issues"
Changelog = "https://github.com/szl-holdings/szl-ci-witness/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.szl.release]
import_names = ["szl_ci_witness"] # wheel top-level import names; the release gate fails if the built wheel differs
