name: Exact-revision public source census

on:
  pull_request:
    paths:
      - tools/source_census.py
      - tests/test_source_census.py
      - tests/test_census_streaming.py
      - .github/workflows/source-census.yml
      - docs/SOURCE_CENSUS.md
  push:
    branches: [main]
    paths:
      - tools/source_census.py
      - tests/test_source_census.py
      - tests/test_census_streaming.py
      - .github/workflows/source-census.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Census offline contracts (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -S -m unittest discover -s tests -p 'test*census*.py' -v
      - run: python -S -m py_compile tools/source_census.py

  census:
    name: Public file coverage, not runtime certification
    needs: contracts
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      # platform's observed Git tree contains 393,188,837 bytes, including video
      # and archived launch bundles. Stream it; do not omit its 9,629 blobs.
      - name: Collect bounded exact-revision public source evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -S tools/source_census.py --org szl-holdings --output audit-out --workers 3 --max-repos 200 --archive-mib 384 --with-ci --retain-review-archives
      - name: Retain observed coverage including explicit failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
